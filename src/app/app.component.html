<div style="padding: 20px; font-family: sans-serif; max-width: 600px; margin: auto;">
  <h1>{{ title }}</h1>
  
  <!-- Add Course Form Component -->
  <app-course-form (courseCreated)="handleCourseCreated($event)"></app-course-form>

  <h2>My Course List:</h2>
  
  <app-course-card 
    *ngFor="let c of courses" 
    [course]="c" 
    (toggleComplete)="handleToggleComplete($event)">
  </app-course-card>
</div>
