<form [formGroup]="courseForm" (ngSubmit)="onSubmit()" class="form-container">
  <h3>Add a New Course</h3>
  
  <div class="form-group">
    <label>Course Title:</label>
    <input type="text" formControlName="title" placeholder="e.g. Advanced RxJS" />
    <small *ngIf="courseForm.get('title')?.invalid && courseForm.get('title')?.touched" class="error">
      Title is required (min 3 characters).
    </small>
  </div>

  <div class="form-group">
    <label>Instructor:</label>
    <input type="text" formControlName="instructor" placeholder="e.g. John Doe" />
    <small *ngIf="courseForm.get('instructor')?.invalid && courseForm.get('instructor')?.touched" class="error">
      Instructor name is required.
    </small>
  </div>

  <button type="submit" [disabled]="courseForm.invalid">Add Course</button>
</form>
